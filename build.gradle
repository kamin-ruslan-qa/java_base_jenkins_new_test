plugins {
    id 'java-library'
    id 'io.qameta.allure' version '4.0.1'
}

allure {
    report {
        version.set("2.19.0")
    }
    adapter { // отвечает за появление каталога build/allure-results
        aspectjWeaver.set(true) //обработка аннотации @Step
        frameworks {
            junit5 { //название фреймворка
                adapterVersion.set("2.19.0") //версия интеграции фреймворка и Allure
            }
        }
    }
}
repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.testng:testng:7.8.0'
    testImplementation 'io.qameta.allure:allure-testng:2.32.0'
    testImplementation 'com.codeborne:selenide:7.15.0'
    testImplementation 'org.slf4j:slf4j-simple:2.0.9'
}

tasks.withType(Test) {
    useTestNG()  // Изменено с useJUnitPlatform на useTestNG

    testLogging {
        events "started", "skipped", "failed", "standard_error", "standard_out"
        exceptionFormat "short"
    }
}